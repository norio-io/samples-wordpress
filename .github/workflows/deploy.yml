name: Deploy to GitHub Pages

# pages/ を GitHub Pages のサイト直下へ公開する。公開元は GitHub Actions とする。
# ビルド工程を持たないため、pages/ をそのまま成果物とする。
#
# main への統合時のみ実行するため、本ワークフローのジョブを
# Ruleset の必須ステータスチェックに追加してはならない。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v5
